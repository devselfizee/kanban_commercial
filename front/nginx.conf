server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Application à page unique : toute route inconnue rend index.html, sinon un
    # rafraîchissement sur /leads renverrait une 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Les fichiers versionnés par leur empreinte peuvent être mis en cache
    # longtemps ; index.html ne doit jamais l'être, sous peine de servir une
    # version obsolète après déploiement.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
